<div id="root" class="ted-preview"></div>
<script>
var T = window.Toms, h = React.createElement;
function Demo() {
  var a = React.useState('system'), b = React.useState('week');
  return h(React.Fragment, null,
    h(T.ButtonGroup, { ariaLabel: 'Theme', value: a[0], onChange: a[1], options: [{ value: 'system', label: 'System' }, { value: 'light', label: 'Light' }, { value: 'dark', label: 'Dark' }] }),
    h(T.ButtonGroup, { ariaLabel: 'Period', size: 'small', value: b[0], onChange: b[1], options: [{ value: 'week', label: 'Week' }, { value: 'month', label: 'Month' }, { value: 'year', label: 'Year' }] }));
}
ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
