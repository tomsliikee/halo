<div id="root" class="ted-preview" style="max-width: 380px"></div>
<script>
var T = window.Toms, h = React.createElement;
function Demo() {
  var a = React.useState(true), b = React.useState(false), c = React.useState(true);
  return h('div', { style: { width: 340 } }, h(T.ListGroup, { items: [
    { label: 'Notifications', control: h(T.Switch, { checked: a[0], onChange: a[1], label: 'Notifications' }) },
    { label: 'Glass effect', control: h(T.Switch, { checked: b[0], onChange: b[1], label: 'Glass effect' }) },
    { label: 'Flexible type', control: h(T.Switch, { checked: c[0], onChange: c[1], label: 'Flexible type' }) }
  ] }));
}
ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
